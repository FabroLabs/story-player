name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm ci --ignore-scripts
      - run: node --test "tests/*.test.mjs"
      - run: npm pack --dry-run --json
      - run: npm pack --json
      - run: node scripts/verify-package.mjs
      - run: node scripts/verify-install.mjs ./fabrolabs-story-player-*.tgz
      - name: Upload public release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./fabrolabs-story-player-*.tgz
      - name: Verify anonymous release install
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-install.mjs "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/fabrolabs-story-player-${RELEASE_TAG#v}.tgz"
