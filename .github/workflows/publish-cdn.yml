name: Publish CDN

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      rollback_commit:
        description: Full immutable commit to restore to stable
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: story-player-cdn-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    environment: cdn-production
    steps:
      - name: Checkout the successful main commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Checkout trusted main for rollback
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refuse a stale successful main run
        if: github.event_name == 'workflow_run'
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$STORY_PLAYER_COMMIT"
        env:
          STORY_PLAYER_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - name: Build the successful main commit
        if: github.event_name == 'workflow_run'
        run: npm run build:cdn
        env:
          STORY_PLAYER_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - name: Publish immutable build and promote stable
        if: github.event_name == 'workflow_run'
        run: npm run publish:cdn
        env:
          STORY_PLAYER_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RUSTFS_URL: ${{ vars.RUSTFS_URL }}
          STORY_PLAYER_BUCKET: story-player
          RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
          RUSTFS_REGION: ${{ vars.RUSTFS_REGION || 'us-east-1' }}
      - name: Roll stable back to an immutable build
        if: github.event_name == 'workflow_dispatch'
        run: npm run rollback:cdn -- "$ROLLBACK_COMMIT"
        env:
          ROLLBACK_COMMIT: ${{ inputs.rollback_commit }}
          RUSTFS_URL: ${{ vars.RUSTFS_URL }}
          STORY_PLAYER_BUCKET: story-player
          RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
          RUSTFS_REGION: ${{ vars.RUSTFS_REGION || 'us-east-1' }}
